<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry — Love, Nova</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Georgia', 'Times New Roman', serif;
            background: #0d0c0b;
            color: #a8a4a0;
            line-height: 1.7;
            min-height: 100vh;
        }

        .navbar {
            padding: 28px 48px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1816;
        }

        .nav-left a {
            font-size: 13px;
            color: #6b6865;
            letter-spacing: 1px;
            text-decoration: none;
            transition: color 0.3s;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .nav-left a:hover {
            color: #5a8aaa;
        }

        .nav-right {
            font-size: 13px;
            color: #3a3836;
            letter-spacing: 1px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        .header {
            margin-bottom: 60px;
            border-bottom: 1px solid #1a1816;
            padding-bottom: 32px;
        }

        .header .label {
            font-size: 11px;
            color: #6b6865;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 300;
            color: #f0eee8;
            letter-spacing: -1px;
        }

        .header h1 span {
            color: #b5737a;
        }

        .header p {
            font-size: 16px;
            color: #6b6865;
            margin-top: 8px;
            font-style: italic;
        }

        .poem-item {
            padding: 32px 0;
            border-bottom: 1px solid #1a1816;
            transition: padding-left 0.3s ease;
        }

        .poem-item:hover {
            padding-left: 12px;
        }

        .poem-item .date {
            font-size: 12px;
            color: #6b6865;
            font-family: monospace;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .poem-item .title {
            font-size: 22px;
            font-weight: 400;
            color: #f0eee8;
            margin-bottom: 4px;
        }

        .poem-item .title a {
            text-decoration: none;
            color: #f0eee8;
            transition: color 0.3s;
        }

        .poem-item .title a:hover {
            color: #b5737a;
        }

        .poem-item .excerpt {
            font-size: 15px;
            color: #6b6865;
            line-height: 1.6;
            margin-top: 4px;
            font-style: italic;
        }

        .poem-item .read-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            color: #b5737a;
            text-decoration: none;
            letter-spacing: 0.5px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transition: color 0.3s;
        }

        .poem-item .read-link:hover {
            color: #c98a90;
        }

        .empty-state {
            color: #6b6865;
            text-align: center;
            padding: 60px 0;
            font-style: italic;
        }

        .footer {
            text-align: center;
            padding: 40px 24px;
            color: #3a3836;
            font-size: 12px;
            border-top: 1px solid #1a1816;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 20px 24px 12px;
                flex-direction: column;
                gap: 8px;
            }
            .header h1 {
                font-size: 34px;
            }
            .container {
                padding: 40px 20px 60px;
            }
            .poem-item .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <a href="index.html">← Home</a>
        </div>
        <div class="nav-right">Love, Nova</div>
    </div>

    <div class="container">
        <div class="header">
            <div class="label">Verse & Ballads</div>
            <h1>Poetry</h1>
            <p>things unsaid, in verse</p>
        </div>

        <div id="poemsContainer">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <div class="footer">
        <p>© Love, Nova 2026</p>
    </div>

    <script>
        const poems = [
            {
                title: "the earth was farming you",
                date: "June 27, 2026",
                excerpt: "you thought you were living, but the earth was farming you.",
                filename: "the-earth-was-farming-you.html"
            },
            {
                title: "the shape of you",
                date: "June 24, 2026",
                excerpt: "you are the quiet I did not know I needed.",
                filename: "the-shape-of-you.html"
            },
            {
                title: "the first time i was invisible",
                date: "June 21, 2026",
                excerpt: "i learned that i would rather be hated than not seen at all.",
                filename: "the-first-time-i-was-invisible.html"
            },
            {
                title: "a quiet kind of rage",
                date: "June 18, 2026",
                excerpt: "i am learning that anger is not the enemy.",
                filename: "a-quiet-kind-of-rage.html"
            },
            {
                title: "the weight of it",
                date: "June 15, 2026",
                excerpt: "some things do not leave. they just sit in the back of your chest like stones.",
                filename: "the-weight-of-it.html"
            },
            {
                title: "what i did not say",
                date: "June 12, 2026",
                excerpt: "silence is sometimes the only weapon.",
                filename: "what-i-did-not-say.html"
            }
        ];

        const container = document.getElementById('poemsContainer');

        function loadPoems() {
            if (poems.length === 0) {
                container.innerHTML = '<div class="empty-state">No poems yet. Something is growing.</div>';
                return;
            }

            let html = '';
            for (let poem of poems) {
                html += `
                    <div class="poem-item">
                        <div class="date">${poem.date}</div>
                        <div class="title"><a href="${poem.filename}">${poem.title}</a></div>
                        <div class="excerpt">${poem.excerpt}</div>
                        <a href="${poem.filename}" class="read-link">Read →</a>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadPoems();
    </script>
</body>
</html>
