<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love, Nova</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Georgia', 'Times New Roman', serif;
            background: #0d0c0b;
            color: #a8a4a0;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVIGATION ===== */
        .navbar {
            padding: 32px 48px 20px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            border-bottom: 1px solid #1a1816;
        }

        .nav-left {
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
        }

        .nav-left .logo {
            font-size: 14px;
            font-weight: 400;
            color: #6b6865;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-left .logo:hover {
            color: #5a8aaa;
        }

        .hamburger {
            cursor: pointer;
            width: 28px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 100;
        }

        .hamburger span {
            width: 100%;
            height: 1.5px;
            background: #a8a4a0;
            transition: all 0.3s ease;
        }

        .hamburger:hover span {
            background: #5a8aaa;
        }

        .menu {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: #1a1816;
            padding: 80px 48px 48px;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 99;
            border-left: 1px solid #2a2826;
        }

        .menu.active {
            right: 0;
        }

        .menu a {
            display: block;
            text-decoration: none;
            font-size: 18px;
            color: #a8a4a0;
            margin-bottom: 24px;
            font-weight: 300;
            letter-spacing: 1px;
            transition: color 0.3s, transform 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .menu a:hover {
            color: #5a8aaa;
            transform: translateX(4px);
        }

        .menu .menu-label {
            font-size: 11px;
            color: #6b6865;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 32px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 98;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 24px 80px;
        }

        .content-block {
            max-width: 700px;
        }

        .content-block .eyebrow {
            font-size: 11px;
            color: #6b6865;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .content-block h1 {
            font-size: 68px;
            font-weight: 300;
            color: #f0eee8;
            letter-spacing: -2px;
            margin-bottom: 16px;
            line-height: 1.1;
        }

        .content-block h1 span {
            color: #2a6a9c;
        }

        .content-block .subtitle {
            font-size: 16px;
            color: #6b6865;
            font-style: italic;
            margin-bottom: 48px;
            font-weight: 300;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 1px solid #2a2826;
            padding: 14px 48px;
            font-size: 13px;
            font-weight: 400;
            color: #a8a4a0;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            width: 220px;
            text-align: center;
        }

        .btn-primary {
            border-color: #1a3a5c;
            color: #5a8aaa;
        }

        .btn-primary:hover {
            background: #1a3a5c;
            color: #f0eee8;
            border-color: #1a3a5c;
        }

        .btn-secondary {
            border-color: #2a2826;
            color: #6b6865;
        }

        .btn-secondary:hover {
            border-color: #5a8aaa;
            color: #5a8aaa;
            background: rgba(26, 58, 92, 0.08);
        }

        .divider-line {
            width: 40px;
            height: 1px;
            background: #2a2826;
            margin: 40px auto 32px;
        }

        .footer-note {
            font-size: 12px;
            color: #3a3836;
            letter-spacing: 1px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .navbar {
                padding: 24px 24px 16px;
            }
            .nav-left {
                left: 24px;
            }
            .content-block h1 {
                font-size: 44px;
            }
            .btn {
                width: 100%;
                max-width: 280px;
                padding: 14px 32px;
                font-size: 12px;
            }
            .menu {
                width: 280px;
                padding: 64px 32px 32px;
                right: -280px;
            }
            .menu a {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">Love, Nova</a>
        </div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="menu" id="menu">
        <div class="menu-label">Navigate</div>
        <a href="who-is-nova.html">Who is Nova?</a>
        <a href="about.html">About</a>
        <a href="thoughts.html">Thoughts</a>
        <a href="poetry.html">Poetry</a>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="main">
        <div class="content-block">
            <div class="eyebrow">A quiet mind</div>
            <h1>Love, <span>Nova</span></h1>
            <div class="subtitle">words from a quiet mind</div>
            <div class="button-group">
                <a href="thoughts.html" class="btn btn-primary">Thoughts</a>
                <a href="poetry.html" class="btn btn-secondary">Poetry</a>
            </div>
            <div class="divider-line"></div>
            <div class="footer-note">© 2026</div>
        </div>
    </div>

    <script>
        const hamburger = document.getElementById('hamburger');
        const menu = document.getElementById('menu');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            menu.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        hamburger.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
